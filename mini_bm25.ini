# Edit values on the right-hand side of "=".
# Keep the existing section and key names used by the starter runner.
# Do not add quotation marks around values.
#
# For a comparison run, copy this file and change the selected component or setting.
# Set a different run_dir so that you do not overwrite an earlier run.

[paths]
documents = data/mini/mini_documents.jsonl
questions = data/mini/mini_dev.json
index = cache/mini_whoosh
run_dir = runs/mini_bm25
api_cache = cache/api_responses.json
# Supplied mini vectors and their aligned document IDs, used by dense retrieval.
document_embeddings = data/mini/mini_document_embeddings.npy
document_ids = data/mini/mini_document_ids.json

[retrieval]
# Comparison run: BM25F retrieval. Select bm25 or dense after implementing that branch.
method = bm25
# BM25F parameters used when method = bm25. k1 controls term-frequency saturation, b controls length normalisation.
k1 = 1.2
b = 0.75
# Document vectors per dense-search batch. Larger batches may reduce loop overhead but use more working memory.
batch_size = 512
# Candidate documents kept per question while scanning document vectors with method = dense.
dense_pool = 1000

[judging]
# Keep b0 for the baseline. Select llm_judge after implementing that branch.
method = b0
# Number of document judgments returned per question: an integer from 1 to 100. The default is 20.
# For LLM judging, larger counts usually increase API use. Cached replies can be reused.
judge_k = 20
# call_judging_model(...) reads these settings. B0 makes no model calls.
model = gpt-5-nano
# Requested output-token limit per model call.
max_tokens = 512

[api]
base_url = https://rmit-isys1079-3476-gateway-aze5hgbtavg2a2bt.australiaeast-01.azurewebsites.net/v1
# This setting controls reuse of chat replies.
# true reuses replies. false makes fresh API calls and updates the saved replies.
# Empty or explicitly truncated API replies are not saved. Check other replies in your method.
# Fresh calls use your API budget. Restore true after checking refreshed replies.
use_cache = true
